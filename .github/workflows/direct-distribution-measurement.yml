name: Direct particle distribution measurement
on: pull_request
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: current
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - name: Build and inspect buffers
        run: |
          mkdir -p results
          lscpu > results/cpu.txt
          for variant in baseline current; do
            cmake -S "$variant" -B "$variant/build" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
            cmake --build "$variant/build" -j 4
            c++ -std=c++23 -O3 -I "$variant/src" current/tools/particle_buffer_probe.cpp "$variant/build/libmc3d_core.a" -pthread -o "$variant/build/particle_buffer_probe"
            for percent in 0 1 100; do
              "$variant/build/particle_buffer_probe" "$percent" > "results/buffers-$variant-$percent.log" 2>&1
            done
          done
      - name: Snapshot comparisons and small scenarios
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('current/configs/example.json').read_text())
          cfg.update(ncx=24,ncy=12,ncz=8,np=60)
          for geometry in ['none','cube','wedge']:
            cfg['geometry_type']=geometry
            Path(f'results/{geometry}.json').write_text(json.dumps(cfg))
          cfg=json.loads(Path('current/configs/benchmark_body_check.json').read_text())
          for count in [20,80]:
            cfg['np']=count
            Path(f'results/hypersonic-{count}.json').write_text(json.dumps(cfg))
          PY
          for geometry in none cube wedge; do
            python3 current/tools/benchmark_body_check.py --baseline baseline/build/MC3dSolver --binary current/build/MC3dSolver --config "results/$geometry.json" --out "results/snapshots-$geometry" --threads 1 --snapshots
            python3 current/tools/benchmark_body_check.py --baseline baseline/build/MC3dSolver --binary current/build/MC3dSolver --config "results/$geometry.json" --out "results/small-$geometry" --threads 1 4
          done
      - name: Reduced wedge at two populations
        run: |
          for count in 20 80; do
            python3 current/tools/benchmark_body_check.py --baseline baseline/build/MC3dSolver --binary current/build/MC3dSolver --config "results/hypersonic-$count.json" --out "results/hypersonic-$count" --threads 1 4 12
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-distribution-measurements
          path: results
