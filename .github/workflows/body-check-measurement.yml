name: Body particle check measurement
on: pull_request
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: current
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - name: Build both solvers
        run: |
          for variant in baseline current; do
            cmake -S "$variant" -B "$variant/build" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
            cmake --build "$variant/build" -j 4
          done
          mkdir -p results
          lscpu > results/cpu.txt
          c++ --version > results/compiler.txt
          git -C baseline rev-parse HEAD > results/baseline-sha.txt
          c++ -std=c++23 -O3 -I current/src current/tools/body_check_cache_probe.cpp current/build/libmc3d_core.a -pthread -o current/build/body_check_cache_probe
          current/build/body_check_cache_probe --config current/configs/benchmark_body_check.json > results/cache.txt
      - name: Snapshot comparison and small benchmarks
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('current/configs/example.json').read_text())
          cfg.update(ncx=24,ncy=12,ncz=8,np=60)
          for geometry in ['none','cube','wedge']:
            cfg['geometry_type']=geometry
            Path(f'results/{geometry}.json').write_text(json.dumps(cfg))
          PY
          for geometry in none cube wedge; do
            python3 current/tools/benchmark_body_check.py --baseline baseline/build/MC3dSolver --binary current/build/MC3dSolver --config "results/$geometry.json" --out "results/snapshots-$geometry" --threads 1 --snapshots
            python3 current/tools/benchmark_body_check.py --baseline baseline/build/MC3dSolver --binary current/build/MC3dSolver --config "results/$geometry.json" --out "results/small-$geometry" --threads 1 4
          done
      - name: Reduced hypersonic wedge
        run: python3 current/tools/benchmark_body_check.py --baseline baseline/build/MC3dSolver --binary current/build/MC3dSolver --config current/configs/benchmark_body_check.json --out results/hypersonic --threads 1 4 12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: body-check-measurements
          path: results
