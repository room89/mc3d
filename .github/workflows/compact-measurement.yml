name: Compact cell measurement
on: pull_request
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: current
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - name: Build both Release solvers and memory probes
        run: |
          for variant in baseline current; do
            cmake -S "$variant" -B "$variant/build" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
            cmake --build "$variant/build" -j 4
            c++ -std=c++23 -O3 -I "$variant/src" current/tools/benchmark_cell_storage.cpp "$variant/build/libmc3d_core.a" -pthread -o "$variant/build/cell_storage_benchmark"
          done
      - name: Repeat small scenarios after timing anomaly
        run: python3 current/tools/benchmark_solver.py --baseline baseline/build/MC3dSolver --binary current/build/MC3dSolver --out results/small --repeats 10
      - uses: actions/upload-artifact@v4
        with:
          name: compact-cell-repeat
          path: results
