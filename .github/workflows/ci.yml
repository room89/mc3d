name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 14 Release
            cc: gcc-14
            cxx: g++-14
            build_type: Release
            sanitizer_flags: ''
          - name: Clang 18 Debug + ASan/UBSan
            cc: clang-18
            cxx: clang++-18
            build_type: Debug
            sanitizer_flags: -fsanitize=address,undefined -fno-omit-frame-pointer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify toolchain
        run: |
          ${{ matrix.cc }} --version
          ${{ matrix.cxx }} --version
          cmake --version
          ninja --version

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          BUILD_TYPE: ${{ matrix.build_type }}
          SANITIZER_FLAGS: ${{ matrix.sanitizer_flags }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_CXX_FLAGS="$SANITIZER_FLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$SANITIZER_FLAGS"

      - name: Build
        run: cmake --build build

      - name: Run tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure --parallel 2

      - name: Repeat collision and concurrent tests
        if: matrix.build_type == 'Release'
        run: >
          ctest --test-dir build --output-on-failure
          --repeat until-fail:3
          -R '^(BodyCollisionTest|BodyReviewRegressionTest|CellClusterIntegrationTest)\.'
